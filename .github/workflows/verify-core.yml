name: Verify independent BREAKLINE CORE
on:
  push:
    branches: [core, core-rework, afterhours-roster, afterhours-motion]
    paths: ['core/**', 'tests/**', 'tools/**', 'package*.json', 'index.html', '.github/workflows/verify-core.yml']
  pull_request:
    branches: [core, core-rework, afterhours-roster, afterhours-motion]
    paths: ['core/**', 'tests/**', 'tools/**', 'package*.json', 'index.html', '.github/workflows/verify-core.yml']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:core
      - run: npm run test:core:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breakline-core-checks
          path: test-artifacts/roster
          if-no-files-found: ignore
# Deliberately no Pages job: CORE must never replace the full game.

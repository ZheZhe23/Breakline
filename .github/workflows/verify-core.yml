name: Verify independent BREAKLINE CORE
on:
  push:
    branches: [core]
  pull_request:
    branches: [core]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breakline-core-checks
          path: test-artifacts/core
          if-no-files-found: ignore
# Deliberately no Pages job: CORE must never replace the full game.
